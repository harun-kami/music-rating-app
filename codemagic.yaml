workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 120
    integrations:
      app_store_connect: "Codemagic"
    environment:
      # ▼▼▼ 誤って消してしまったこのブロックを復活！ ▼▼▼
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mydigs.app
      # ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
      vars:
        NEXT_PUBLIC_SUPABASE_URL: "https://mqjefmzhccklkczsrhba.supabase.co/rest/v1/" # ★君の実際のURL
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_2qYxaHe0pgCa6shiA3eoZw_bkI1qnGx"         # ★君の実際のキー
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Next.js app
        script: npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync ios
          sed -i '' 's/com.capacitorjs.app/com.mydigs.app/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Setup Code Signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.mydigs.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false