workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 120
    integrations:
      app_store_connect: "Codemagic"
    environment:
      vars:
        NEXT_PUBLIC_SUPABASE_URL: "https://mqjefmzhccklkczsrhba.supabase.co/rest/v1/" # ★君のURLを入れる
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_2qYxaHe0pgCa6shiA3eoZw_bkI1qnGx"         # ★君のキーを入れる
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Next.js app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Setup Code Signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.mydigs.app" --type IOS_APP_STORE --create
          keychain add-certificates
          # ▼▼▼ ここに「--project」の場所指定を追加した！ ▼▼▼
          xcode-project use-profiles --project "ios/App/App.xcodeproj"
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false