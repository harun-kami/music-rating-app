workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 120
    # ▼▼▼ これを追加！ ▼▼▼
    integrations:
      app_store_connect: "Codemagic" # ★先ほどCodemagicの連携画面で入力した「名前」と一言一句同じものを入れる
    # ▲▲▲▲▲▲▲▲▲▲▲▲▲▲
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mydigs.app # ★必ずApple Developerで登録した君の実際のBundle IDに書き換える！
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Next.js app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false