workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 120
    integrations:
      app_store_connect: "Codemagic"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Next.js app
        script: npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync ios
          sed -i '' 's/com.capacitorjs.app/com.mydigs.app/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Setup Code Signing
        script: |
          keychain initialize
          # ▼ここで「プロフィールが無ければ強制的に作成する（--create）」と命令している
          app-store-connect fetch-signing-files "com.mydigs.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false