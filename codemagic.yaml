workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 120
    integrations:
      app_store_connect: "Codemagic"
    environment:
      groups:
        - ios_manual # さっきCodemagicで作ったグループ！
      vars:
        NEXT_PUBLIC_SUPABASE_URL: "https://mqjefmzhccklkczsrhba.supabase.co/rest/v1/" # ★君のURLを入れる
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_2qYxaHe0pgCa6shiA3eoZw_bkI1qnGx"         # ★君のキーを入れる
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Next.js app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Setup Manual Code Signing
        script: |
          # 登録した変数をファイルとして復元する
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          echo "$CM_PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          
          # 鍵穴を初期化して、君の鍵をガチャンとはめる！
          keychain initialize
          keychain add-certificates --certificate /tmp/cert.p12 --certificate-password "$CM_CERT_PASSWORD"
          xcode-project use-profiles --profile /tmp/profile.mobileprovision --project "ios/App/App.xcodeproj"
      - name: Build iOS app
        script: |
          # 1. UUIDを抽出
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID raw -)
          echo "抽出したプロファイルのUUID: $UUID"
          
          # 2. プロファイルをMacの正しい保管庫（Provisioning Profilesフォルダ）にコピーする！
          PROFILE_DIR=$HOME/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILE_DIR"
          cp /tmp/profile.mobileprovision "$PROFILE_DIR/$UUID.mobileprovision"
          
          # 3. ビルド実行
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" \
            --archive-flags="-destination 'generic/platform=iOS' PROVISIONING_PROFILE_SPECIFIER=$UUID PROVISIONING_PROFILE=$UUID" \
            --disable-xcpretty
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false